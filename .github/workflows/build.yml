name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Self-check (the program must not flag itself)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force selfcheck | Out-Null
          Copy-Item target/release/bimbo-guard.exe selfcheck/copy-of-bimbo-guard.exe
          $env:BIMBO_GUARD_HOME = "$PWD/hg-data"
          $env:BIMBO_GUARD_NO_SELF_SKIP = "1"
          ./target/release/bimbo-guard.exe scan selfcheck --no-quarantine
          if ($LASTEXITCODE -ne 0) { throw "bimbo-guard.exe flagged a copy of itself" }

      - name: Hash
        shell: pwsh
        run: (Get-FileHash target/release/bimbo-guard.exe -Algorithm SHA256).Hash.ToLower() + "  bimbo-guard.exe" | Out-File -Encoding ascii target/release/bimbo-guard.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bimbo-guard-windows
          path: |
            target/release/bimbo-guard.exe
            target/release/bimbo-guard.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bimbo-guard.exe
            target/release/bimbo-guard.exe.sha256
          generate_release_notes: true
