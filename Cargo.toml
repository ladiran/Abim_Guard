[package]
name = "bimbo-guard"
version = "0.2.0"
edition = "2024"
authors = ["Oladiran Johnson Abimbola <abimbola.oladiran@science.fulafia.edu.ng>"]
description = "Companion malware scanner for Windows that works alongside Microsoft Defender"
license = "MIT"
repository = "https://github.com/ladiran/Bimbo_Guard"

[dependencies]
yara-x = "1.22"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
notify = "8"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
dirs = "6"
anyhow = "1"
crossbeam-channel = "0.5"
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "ApplicationModel_Activation",
    "Foundation",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_Devices_Usb",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
